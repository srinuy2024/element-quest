<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="flask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer Orbit Rings -->
  <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="14 10" transform="rotate(-30 256 256)" opacity="0.6" />
  <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="#ec4899" stroke-width="6" stroke-dasharray="14 10" transform="rotate(30 256 256)" opacity="0.6" />
  <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="#facc15" stroke-width="6" stroke-dasharray="14 10" transform="rotate(90 256 256)" opacity="0.5" />

  <!-- Orbiting Electrons -->
  <circle cx="90" cy="160" r="14" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="420" cy="350" r="14" fill="#ec4899" filter="url(#glow)" />
  <circle cx="256" cy="56" r="14" fill="#facc15" filter="url(#glow)" />

  <!-- Science Flask Mascot -->
  <path d="M 226 120 L 286 120 L 286 180 L 370 340 A 30 30 0 0 1 344 384 L 168 384 A 30 30 0 0 1 142 340 L 226 180 Z" 
        fill="url(#flask)" 
        stroke="#ffffff" 
        stroke-width="12" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Liquid inside flask -->
  <path d="M 174 340 L 338 340 A 24 24 0 0 1 320 372 L 192 372 A 24 24 0 0 1 174 340 Z" fill="#ffffff" opacity="0.3" />

  <!-- Cute Mascot Eyes & Smile -->
  <circle cx="230" cy="290" r="10" fill="#ffffff" />
  <circle cx="282" cy="290" r="10" fill="#ffffff" />
  <path d="M 244 316 Q 256 328 268 316" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />

  <!-- Star Sparkles -->
  <path d="M 380 140 Q 380 160 400 160 Q 380 160 380 180 Q 380 160 360 160 Q 380 160 380 140 Z" fill="#facc15" />
  <path d="M 120 300 Q 120 315 135 315 Q 120 315 120 330 Q 120 315 105 315 Q 120 315 120 300 Z" fill="#38bdf8" />
</svg>
